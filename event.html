<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>얼짱캠 출시기념 이벤트 종료</title>

<style>

  h1 { font-size:18px; margin-bottom:6px; }
  p { font-size:13px; color:#445; }
  .en { margin-top:16px; padding-top:14px; border-top:1px dashed #b5b2a4; font-size:12px; color:#667; }

<body>
  <div class="win">

      <p class="en">The Y2K Cam launch event has ended. Thank you for joining!<br>Winners keep their 1-year Premium.</p>
    </div>
  </div>
</body>
</html>
